name: check

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test-tools
      - run: yarn check-wiring
      - run: yarn check-imports
      - run: yarn test-units
