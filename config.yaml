network: dianet.work
# Once a day at 5 am
blockSchedule: "0 5 * * *"
vendors:
  cache:
    redis:
      ip:
        production: 10.79.5.20
  cloud:
    gcp:
      projects:
        production: production-462319
        sandbox: playground-462319
        staging: staging-462319
        development: development-462319
      computeUrlIds:
        production: 
        sandbox: 
        staging: 
        development: 
      dnsZone: network
      secretsBuckets:
        production: production-secrets-462319
        sandbox: sandbox-secrets-462319
        staging: staging-secrets-462319
        development: development-secrets-462319
      rolesBuckets:
        production: production-roles-462319
        sandbox: sandbox-roles-462319
        staging: staging-roles-462319
        development: development-roles-462319
      defaults:
        region: us-central1
        timeout: 120s
        memory: 512Mi
  viewStore:
    mongodb:
      users:
        production: blossm
        sandbox: blossm
        staging: blossm
        development: blossm
      hosts:
        production: view-store.xpbhz.gcp.mongodb.net
        sandbox: view-store.fzyij.gcp.mongodb.net
        staging: view-store.ahi18.gcp.mongodb.net
        development: view-store.y8mw0ub.gcp.mongodb.net
      protocol: mongodb+srv
  eventStore:
    mongodb:
      users:
        production: blossm
        sandbox: blossm
        staging: blossm
        development: blossm
      hosts:
        production: event-store-pri.7iksa.gcp.mongodb.net
        sandbox: event-store-pri.dyntm.gcp.mongodb.net
        staging: event-store.zhvxy.gcp.mongodb.net
        development: event-store.czxzvwh.mongodb.net
      protocol: mongodb+srv
defaults:
  viewStore: mongodb
  eventStore: mongodb
  cloud: gcp
  cache: redis

defaultEnv: development
