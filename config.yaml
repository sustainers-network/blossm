# Blossm services configuration, read by the Toolbox CLI.
#
# Only the development environment is configured: the core/session PostgreSQL
# event store (docs/DEVELOPMENT_SETUP.md) and the prepared session start path
# (docs/SESSION_START_DEPLOYMENT.md). Those guides list the cloud prerequisites
# and what is deliberately absent below.
network: blossm.network
# Once a day at 5 am
blockSchedule: "0 5 * * *"
# Full environment names. The matching DNS zone is development.blossm.network.
environmentPrefixes:
  development: "development."
  staging: "staging."
  production: ""
vendors:
  cloud:
    gcp:
      projects:
        development: blossm-network-development
      # The project number, used for deterministic Cloud Run URLs.
      computeUrlIds:
        development: 514604832519
      # Cloud DNS managed zone name, passed as --zone by gateway deployments.
      dnsZone: blossm-development
      registries:
        development: us-east1-docker.pkg.dev/blossm-network-development/blossm
      buildServiceAccounts:
        development: blossm-build@blossm-network-development.iam.gserviceaccount.com
      # The default runtime identity of every procedure in this environment.
      # It is the session event store's identity and holds its database and
      # block key access, so no other procedure may run as it. A procedure
      # names its own identity with runtimeServiceAccounts in its blossm.yaml,
      # which wins over this default. Deploy a procedure without that override
      # only if it is the session event store. CLIs up to 0.0.1961 ignore the
      # override and would deploy every procedure as this account.
      runtimeServiceAccounts:
        development: blossm-session@blossm-network-development.iam.gserviceaccount.com
      # No VPC connector. Internal services still require an authenticated invoker.
      vpcConnectors:
        development: null
      ingress:
        development: all
      maxInstances:
        development: 1
      minInstances:
        development: 0
      # No secrets or roles bucket exists, and the PostgreSQL event store reads
      # neither. Name them here when a consumer (gateways, encrypted secrets) is deployed.
      secretsBuckets: {}
      rolesBuckets: {}
      defaults:
        region: us-east1
        timeout: 120s
        memory: 512Mi
  eventStore:
    postgres:
      connections:
        development:
          database: blossm
          user: blossm_runtime
          max: 2
          cloudSqlInstance: blossm-network-development:us-east1:blossm-pg
          # Bound by Cloud Run as PG_PASSWORD. The value is never read by the CLI.
          passwordSecret:
            name: blossm-postgres-password
            version: "1"
# No view store or cache is configured: there is no PostgreSQL view-store
# adapter yet, and the previous MongoDB Atlas and Redis addresses are removed.
defaults:
  eventStore: postgres
  cloud: gcp

defaultEnv: development
