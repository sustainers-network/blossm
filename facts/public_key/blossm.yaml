name: public-key

dependencies:
  "@google-cloud/kms": "*"

testing:
  steps:
    - code: 200

#don't change
procedure: fact

# Runtime identity of this service only, see docs/SESSION_START_DEPLOYMENT.md.
# Reads the public half of jwt/access. It cannot sign.
runtimeServiceAccounts:
  development: blossm-public-key@blossm-network-development.iam.gserviceaccount.com

# Granted to the runtime identity by the deployment.
keys:
  - ring: jwt
    name: access
    use: verify
