domain: session
service: core

commands:
  - name: start
    # The same as "none", but if there **is** a token, parse out its context.
    protection: context
  - name: save
    privileges: none
  - name: terminate
    privileges: none
  - name: change-scene
    privileges: none

# Runtime identity of this service only, see docs/SESSION_START_DEPLOYMENT.md.
# Invokes the commands above, so it needs roles/run.invoker on each of their
# services before this gateway is deployed. No key or database access.
runtimeServiceAccounts:
  development: blossm-session-gateway@blossm-network-development.iam.gserviceaccount.com

#don't change
procedure: command-gateway
