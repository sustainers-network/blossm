name: save
domain: session
service: core

# This command must be issued from a session.
contexts:
  - session

payload:
  # The email to save the session to.
  email: email
  # The optional password to save the session with.
  # If specified, it'll be required when trying to challenge the account from here on out.
  password:
    type: string
    optional: true

dependencies:
  "@blossm/array-difference": "*"
  "@blossm/email-validator": "*"
  "@blossm/crypt": "*"
  "@blossm/errors": "*"
  "@blossm/gcp-kms": "*"
  "@blossm/hmac": "*"
  "@blossm/gcp-secret": "*"

devDependencies:
  "mocha": "^11.6.0"
  "chai": "^5.2.0"
  "sinon": "^21.0.0"
  "sinon-chai": "^4.0.0"
  "chai-datetime": "^1.8.1"

testing:
  validate:
    ok:
      - email: some@email.com
        # password: some-password
    bad:
      - email: bad
      # - password: 1

  normalize:
    - payload:
        email: Some@email.com
      normalized:
        email: some@email.com
    - payload:
        email: Some@email.com
        password: some-password
        something: something
      normalized:
        email: some@email.com
        password: some-password

  dependencies:
    - domain: principal
      procedure: event-store
      service: core
    - domain: group
      procedure: event-store
      service: core
    - domain: account
      procedure: event-store
      service: core
    - domain: challenge
      name: issue
      procedure: command
      service: core

  steps:
    # 0. Should return 409 if the password is wrong.
    - pre:
        # Make sure there is an account registered.
        - domain: account
          service: core
          root: some-account-root
          action: register
          payload:
            emailHmac: 
              type: hmac 
              secretKey: email-hmac-key
              message: some@accountemail.com
            password: "#some-password"
            principal:
              root: some-sub
              service: some-service
              network: some.network
      # Send the wrong password for the account's email.
      payload:
        email: some@accountemail.com
        password: some-bogus
      code: 409

    # 1. Should return an empty response if saving isn't necessary.
    - pre:
        # Make sure there is an account registered.
        - domain: account
          service: core
          root: some-other-account-root
          action: register
          payload:
            emailHmac: 
              type: hmac 
              secretKey: email-hmac-key
              message: some-other@accountemail.com
            password: "#some-other-password"
            principal:
              root: some-principal-root
              service: some-service
              network: some.network
      # Send the correct email and password for the account.
      payload:
        email: some-other@accountemail.com
        password: "some-other-password"
      context:
        # Send from the principal that is already associated with the account.
        principal:
          root: some-principal-root
          service: some-service
          network: some.network
      code: 204

    # 2. Returns successfully if saving a new account, without a password.
    - pre:
        # Make sure there is principal stored, cant have a subject.
        - domain: principal 
          service: core
          root: some-principal-root
          action: add-roles
          payload:
            roles:
              - id: some-random-role
                subject:
                  root: some-random-root
                  domain: some-random-domain
                  service: some-random-service
      payload:
        email: new@email.com
      # Send from the principal that uses the service and network of a dependency event store.
      context:
        principal:
          root: some-principal-root
          service: core
          network: local.network
      code: 202
      response:
        receipt:
          # There should be a new challenge
          challenge:
            root:
            service:
            network:
          # There should be a new account
          account:
            root:
            service:
            network:
      # A challenge token should be returned.
      tokens:
        - network:
          type: challenge
          value:

    # 3. Returns successfully if saving a new account, with a password.
    - pre:
        # Make sure there is principal stored, cant have a subject.
        - domain: principal 
          service: core
          root: some-brand-new-principal-root
          action: add-roles
          payload:
            roles:
              - id: some-random-role
                subject:
                  root: some-random-root
                  domain: some-random-domain
                  service: some-random-service
      payload:
        email: brand-new@email.com
        password: "a-password"
      context:
        principal:
          root: some-brand-new-principal-root
          service: core
          network: some.network
      code: 202
      response:
        receipt:
          # There should be a new challenge
          challenge:
            root:
            service:
            network:
          # There should be a new account
          account:
            root:
            service:
            network:
      # A challenge token should be returned.
      tokens:
        - network:
          type: challenge
          value:

    # 4. Returns 400 if the session's principal is already associated with another subject.
    - pre:
        # Make sure there is an account registered.
        - domain: principal 
          service: core
          root: some-used-principal
          action: set-subject
          payload:
            subject:
              domain: account
              root: some-subject-root
              service: some-subject-service
              network: some-subject-network
      payload:
        email: brand-new@email.com
        password: "a-password"
      context:
        # Make the request from a principal that is already associated with another account.
        principal:
          root: some-used-principal
          service: core
          network: local.network
      code: 400

    # 5. Return successfully if saving a new email with a context that has
    # a principal that doesn't yet belong to an account.
    - pre:
        # Add a role to the principal.
        - domain: principal
          service: core
          root: some-principal-root
          action: add-roles
          payload:
            roles:
              - id: some-role
                subject:
                  root: some-root
                  domain: some-domain
                  service: some-service
                  network: some.network
        # Add the principal to a group.
        - domain: group
          service: core
          root: some-group-root
          action: add-principals
          payload:
            principals:
              - root: some-principal-root
                service: core
                network: local.network
        # Add a role to another principal, these will be merged with the first principal's roles.
        - domain: principal
          service: core
          root: some-other-principal-root
          action: add-roles
          payload:
            roles:
              - id: some-other-role
                subject:
                  root: some-other-root
                  domain: some-domain
                  service: some-service
                  network: some.network
        # Add the other principal to another group, this will be replaced with the other principal.
        - domain: group
          service: core
          root: some-other-group-root
          action: add-principals
          payload:
            principals:
              - root: some-other-principal-root
                service: core
                network: local.network
        # Make an account for one of the principals.
        - domain: account
          service: core
          root: yet-another-account-root
          action: register
          payload:
            emailHmac: 
              type: hmac 
              secretKey: email-hmac-key
              message: yet-another@accountemail.com
            password: "#yet-another-password"
            principal:
              root: some-principal-root
              service: some-service
              network: some.network
      # Send the email and password for the account.
      payload:
        email: yet-another@accountemail.com
        password: "yet-another-password"
      # Make the call from the principal not associated with the account.
      context:
        principal:
          root: some-other-principal-root
          service: core
          network: local.network
      response:
        receipt:
          # There should be a new challenge
          challenge:
            root:
            service:
            network:
      # A challenge token should be returned.
      tokens:
        - network:
          type: challenge
          value:
      code: 202

    # 6. Should return 400 if the principal in the context belongs to a different account.
    - pre:
        # Add a role to another principal.
        - domain: principal
          service: core
          root: some-other-principal-root_1
          action: set-subject
          payload:
            subject:
              root: some-other-role-subject-root
              domain: some-domain
              service: some-service
              network: some.network
        # Make an account for the first principal.
        - domain: account
          service: core
          root: yet-another-account-root_1
          action: register
          payload:
            emailHmac: 
              type: hmac 
              secretKey: email-hmac-key
              message: yet-another@account-id1.com
            password: "#a-great-password"
            principal:
              root: some-principal-root_1
              service: core
              network: local.network
      # Send the email and password for the account.
      payload:
        email: yet-another@account-id1.com
        password: a-great-password
      
      # Make the request from the other principal associated with another account.
      context:
        principal:
          root: some-other-principal-root_1
          service: core
          network: local.network
      code: 400

#don't change
procedure: command
