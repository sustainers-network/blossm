name: change-scene
domain: session
service: core

contexts:
  - session
  - principal

payload:
  scene: string

dependencies:
  "@blossm/jwt": "*"
  "@blossm/gcp-kms": "*"
  "@blossm/datetime": "*"
  "@blossm/errors": "*"

devDependencies:
  "mocha": "^11.6.0"
  "chai": "^5.2.0"
  "sinon": "^21.0.0"
  "sinon-chai": "^4.0.0"
  "chai-datetime": "^1.8.1"

testing:
  validate:
    ok:
      - scene: some-scene-root
    bad:
      - scene:
          a: 1

  normalize:
    - payload:
        scene: some-scene-root
        something: something
      normalized:
        scene: some-scene-root

  dependencies:
    - domain: scene
      procedure: event-store
      service: core
    - domain: principal
      procedure: event-store
      service: core
    - domain: group
      procedure: event-store
      service: core

  steps:
    # 0. Should change scene if the context principal is in the scene's group.
    - pre:
        # Make sure there is a session started, not terminated.
        - domain: session
          service: core
          root: some-root
          action: start
          payload: {}
        # Make sure the scene is registered and has a group.
        - domain: scene
          service: core
          root: some-scene-root
          action: register
          payload:
            domain: some-scene-domain
            root: some-scene-root
            group:
              root: some-group-root
              service: core
              network: local.network
        # Make sure the scene's group has the context principal.
        - domain: group 
          service: core
          root: some-group-root
          action: add-principals
          payload:
            principals:
              - root: some-principal-root
                service: some-principal-service
                network: local.network
      # Change into the scene.
      payload:
        scene: some-scene-root
      # Fill some arbitrary claims.
      claims:
        iss: some-iss
        aud: some-aud
        exp: 20000
      context:
        # Make sure the context principal is in the scene's group.
        principal:
          root: some-principal-root
          service: some-principal-service
          network: local.network
        # Use the session that hasn't terminated.
        session:
          root: some-root
      # Expect a new access token.
      tokens:
        - network:
          type: access
          value:
      code: 202
    # 1. Should throw if the context principal is not in the scene's group.
    - pre:
        # Make sure the scene is registered and has a group.
        - domain: scene
          service: core
          root: some-other-scene-root
          action: register
          payload:
            group:
              root: some-other-group-root
              service: core
              network: local.network
        # Make sure the scene's group doesn't have the context principal.
        - domain: group 
          service: core
          root: some-other-group-root
          action: add-principals
          payload:
            principals:
              - root: bogus
                service: some-service
                network: local.network
      # Change into the scene.
      payload:
        scene: some-other-scene-root
      # Fill some arbitrary claims.
      claims:
        iss: some-iss
        aud: some-aud
        exp: 20000
      context:
        # Make sure the context principal is not in the scene's group.
        principal:
          root: some-principal-root
          service: some-principal-service
          network: local.network
        # Use the session that hasn't terminated.
        session:
          root: some-root
      code: 403
    # 2. Should throw if the session has been terminated.
    - pre:
        # Make sure the session is terminated.
        - domain: session
          service: core
          root: some-root
          action: terminate
          payload:
            terminated: 2019-12-31T00:00:00.000Z
      # Change into a scene that exists.
      payload:
        scene: some-scene-root
      # Fill some arbitrary claims.
      claims:
        iss: some-iss
        aud: some-aud
        exp: 20000
      context:
        # Make sure the context principal is in the scene's group.
        principal:
          root: some-principal-root
          service: some-principal-service
          network: local.network
        # Use the session that has terminated.
        session:
          root: some-root
      code: 400

#don't change
procedure: command
