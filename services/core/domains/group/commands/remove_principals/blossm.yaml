name: remove-principals
domain: group
service: core

root: true

contexts:
  - principal

payload:
  principals:
    - root: string
      service: string
      network: domain

dependencies:
  "@blossm/errors": "*"

devDependencies:
  "mocha": "^11.6.0"
  "chai": "^5.2.0"
  "sinon": "^21.0.0"
  "sinon-chai": "^4.0.0"

testing:
  validate:
    ok:
      - principals:
          - root: some-root
            service: some-service
            network: some.network
    bad:
      - principals: 3
      - principals:
          - root: 3
      - principals:
          - service: 3
      - principals:
          - network: 3
      - principals:
          - network: some-bad-network

  normalize:
    - payload:
        principals:
          - root: some-root
            service: some-service
            network: some.network
            bogus: some-bogus
          - root: some-root
            service: some-service
            network: some.network
      normalized:
        principals:
          - root: some-root
            service: some-service
            network: some.network

  dependencies:
    - domain: principal
      service: core
      procedure: event-store

  steps:
    # 0. An admin removes a member.
    - pre:
        - domain: group
          service: core
          root: some-group-root
          action: add-networks
          payload:
            networks:
              - some.group-network
        - domain: group
          service: core
          root: some-group-root
          action: add-principals
          payload:
            principals:
              - root: some-admin-root
                service: core
                network: some.group-network
        - domain: principal
          service: core
          root: some-admin-root
          action: add-roles
          payload:
            roles:
              - id: GroupAdmin
                subject:
                  root: some-group-root
                  domain: group
                  service: core
                  network: local.network
        - domain: group
          service: core
          root: some-group-root
          action: add-principals
          payload:
            principals:
              - root: some-principal-root
                service: core
                network: some.group-network
        - domain: principal
          service: core
          root: some-principal-root
          action: add-roles
          payload:
            roles:
              - id: GroupMember
                subject:
                  root: some-group-root
                  domain: group
                  service: core
                  network: local.network
        - domain: group
          service: core
          root: some-group-root
          action: add-principals
          payload:
            principals:
              - root: some-leaver-root
                service: core
                network: some.group-network
        - domain: principal
          service: core
          root: some-leaver-root
          action: add-roles
          payload:
            roles:
              - id: GroupMember
                subject:
                  root: some-group-root
                  domain: group
                  service: core
                  network: local.network
      payload:
        principals:
          - root: some-principal-root
            service: core
            network: some.group-network
      context:
        network: some.group-network
        principal:
          root: some-admin-root
          service: core
          network: some.group-network
      root: some-group-root
      code: 202
    # 1. Nothing left to remove.
    - payload:
        principals:
          - root: some-principal-root
            service: core
            network: some.group-network
      context:
        network: some.group-network
        principal:
          root: some-admin-root
          service: core
          network: some.group-network
      root: some-group-root
      code: 204
    # 2. A principal that isn't a member is refused.
    - payload:
        principals:
          - root: some-admin-root
            service: core
            network: some.group-network
      context:
        network: some.group-network
        principal:
          root: some-outsider-root
          service: core
          network: some.group-network
      root: some-group-root
      code: 403
    # 3. A member that isn't an admin can't remove someone else.
    - payload:
        principals:
          - root: some-admin-root
            service: core
            network: some.group-network
      context:
        network: some.group-network
        principal:
          root: some-leaver-root
          service: core
          network: some.group-network
      root: some-group-root
      code: 403
    # 4. An admin can't remove themselves.
    - payload:
        principals:
          - root: some-admin-root
            service: core
            network: some.group-network
      context:
        network: some.group-network
        principal:
          root: some-admin-root
          service: core
          network: some.group-network
      root: some-group-root
      code: 403
    # 5. A member can leave.
    - payload:
        principals:
          - root: some-leaver-root
            service: core
            network: some.group-network
      context:
        network: some.group-network
        principal:
          root: some-leaver-root
          service: core
          network: some.group-network
      root: some-group-root
      code: 202
    # 6. A group that isn't in the caller's network is refused.
    - pre:
        - domain: group
          service: core
          root: some-other-group-root
          action: add-networks
          payload:
            networks: []
      payload:
        principals:
          - root: some-principal-root
            service: core
            network: some.group-network
      context:
        network: some.group-network
        principal:
          root: some-admin-root
          service: core
          network: some.group-network
      root: some-other-group-root
      code: 403

#don't change
procedure: command
