name: add-principals
domain: group
service: core

payload:
  principals:
    - roles:
        - type: string
          in:
            - GroupAdmin
            - GroupMember
      root: string
      service: string
      network: domain

dependencies:
  "@blossm/uuid": "*"
  "@blossm/errors": "*"

devDependencies:
  "mocha": "^11.6.0"
  "chai": "^5.2.0"
  "sinon": "^21.0.0"
  "sinon-chai": "^4.0.0"

testing:
  validate:
    ok:
      - principals:
          - roles:
              - GroupAdmin
            root: some-root
            service: some-service
            network: some.network
    bad:
      - principals: 3
      - principals:
          - roles:
              - some-bogus
      - principals:
          - roles: some-bogus
      - principals:
          - root: 3
      - principals:
          - service: 3
      - principals:
          - network: 3
      - principals:
          - network: some-bad-network

  normalize:
    - payload:
        principals:
          - roles:
              - some-role
              - some-role
              - some-other-role
            root: some-root
            service: some-service
            network: some.network
            bogus: some-bogus
      normalized:
        principals:
          - roles:
              - some-role
              - some-other-role
            root: some-root
            service: some-service
            network: some.network

  dependencies:
    - domain: principal
      service: core
      procedure: event-store

  steps:
    - pre:
        - domain: group
          service: core
          root: some-group-root
          action: add-networks
          payload:
            networks:
              - some.group-network
            principals: []
        - domain: group
          service: core
          root: some-group-root
          action: add-principals
          payload:
            principals:
              - root: some-admin-root
                service: core
                network: some.group-network
        - domain: principal
          service: core
          root: some-admin-root
          action: add-roles
          payload:
            roles:
              - id: GroupAdmin
                subject:
                  root: some-group-root
                  domain: group
                  service: core
                  network: local.network
      payload:
        principals:
          - roles:
              - GroupAdmin
            root: some-principal-root
            service: core
            network: some.group-network
      context:
        network: some.group-network
        principal:
          root: some-admin-root
          service: core
          network: some.group-network
      root: some-group-root
      code: 202
    # A same-network principal that is not a GroupAdmin member of the group is refused.
    - payload:
        principals:
          - roles:
              - GroupAdmin
            root: some-outsider-root
            service: core
            network: some.group-network
      context:
        network: some.group-network
        principal:
          root: some-outsider-root
          service: core
          network: some.group-network
      root: some-group-root
      code: 403
    - payload:
        principals:
          - roles:
              - GroupAdmin
            root: some-principal-root
            service: some-principal-service
            network: some.network
      context:
        network: some.network
      response:
        receipt:
          group:
            root:
            service:
            network:
      code: 202
    - pre:
        - domain: group
          service: core
          root: some-other-group-root
          action: add-networks
          payload:
            networks: []
            principals: []
      payload:
        principals:
          - roles:
              - GroupAdmin
            root: some-principal-root
            service: core
            network: some.group-network
      context:
        network: some.group-network
      root: some-other-group-root
      code: 403

#don't change
procedure: command
