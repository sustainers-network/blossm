name: principals
domain: group
service: core

dependencies:
  "@blossm/errors": "*"

testing:
  dependencies:
    - domain: group
      procedure: event-store
      service: core

  steps:
    - pre:
        - domain: group
          service: core
          root: some-group-root
          action: add-principals
          payload:
            principals:
              - root: some-principal-root
                service: some-principal-service
                network: some.network
      root: some-group-root
      context:
        principal:
          root: some-principal-root
          service: some-principal-service
          network: some.network
      response:
        - root: some-principal-root
          service: some-principal-service
          network: some.network
    # A caller that isn't in the group.
    - root: some-group-root
      context:
        principal:
          root: some-other-principal-root
          service: some-principal-service
          network: some.network
      code: 403
    - root: some-bogus-root
      code: 404

#don't change
procedure: fact
