domain: challenge
service: core

isPublic: false

actions:
  - issue
  - answer

schema:
  code: String
  upgrade: Object
  issued: Date
  answered: String
  answerId: String
  expires: Date
  events:
    - Object
  claims:
    exp: Date
    iss: String
    sub: String
    aud: String

devDependencies:
  "localenv": "^0.2.2"
  "mocha": "^11.6.0"
  "chai": "^5.2.0"
  "@blossm/request": "*"
  "@blossm/uuid": "*"

testing:
  examples:
    - action: issue
      payload:
        issued: 2020-01-03T00:02:12.000Z
        upgrade:
          principal:
            root: some-root
            service: some-principal-service
            network: some.principal-network
        expires: 2020-01-03T00:02:15.000Z
        events:
          - anything: goes
        claims:
          exp: 2020-01-03T00:02:15.000Z
          aud: some-audience
          sub: some-subject
          iss: 2020-01-03T00:02:15.000Z
    - action: answer
      payload:
        answered: "2020-01-03T00:02:13.000Z"
        answerId: some-answer-id

  handlers:
    - action: issue
      examples:
        - payload:
            issued: 2020-01-03T00:02:12.000Z
            upgrade:
              principal:
                root: some-root
                service: some-principal-service
                network: some.principal-network
            expires: 2020-01-03T00:02:15.000Z
            events:
              - any: thing
            claims:
              exp: 2020-01-03T00:02:15.000Z
              aud: some-audience
              sub: some-subject
              iss: 2020-01-03T00:02:15.000Z
    - action: answer
      examples:
        - payload:
            answered: "2020-01-03T00:02:13.000Z"
            answerId: some-answer-id

#don't change
procedure: event-store
