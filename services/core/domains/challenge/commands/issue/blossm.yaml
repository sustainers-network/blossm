name: issue
domain: challenge
service: core

# For now, challenges can only be issued by email.
payload:
  email: email
  password: 
    type: string
    optional: true

dependencies:
  "@blossm/jwt": "*"
  "@blossm/gcp-kms": "*"
  "@blossm/duration-consts": "*"
  "@blossm/datetime": "*"
  "@blossm/random-int-of-length": "*"
  "@blossm/errors": "*"
  "@blossm/crypt": "*"
  "@blossm/hmac": "*"
  "@blossm/gcp-secret": "*"

devDependencies:
  "mocha": "^11.6.0"
  "chai": "^5.2.0"
  "sinon": "^21.0.0"
  "sinon-chai": "^4.0.0"
  "chai-datetime": "^1.8.1"

testing:
  validate:
    ok:
      - email: some@email.com
        password: some-password
    bad:
      - email: bad
      - password: 919

  normalize:
    - payload:
        email: Some@email.com
        password: some-password
      normalized:
        email: some@email.com
        password: some-password
    - payload:
        email: Some@email.com
      normalized:
        email: some@email.com

  dependencies:
    - domain: account
      procedure: event-store
      service: core
    - domain: challenge
      procedure: event-store
      service: core
    - name: send-auth-code
      domain: email
      procedure: command
      service: comms

  steps:
    # 0. Should return 409 if the email isn't found.
    - payload:
        email: some@email.com
        password: some-password
      code: 409
    # 1. Should return successfully if upgrading a principal.
    - options:
        upgrade:
          principal:
            root: some-principal-root
            service: some-principal-service
            network: some.principal-network
      payload:
        email: some@email.com
        password: some-password
      context:
        principal:
          root: some-principal-root
          service: some-principal-service
          network: some-principal-network
      response:
        receipt:
          challenge:
            root:
            service:
            network:
      tokens:
        - network:
          type: challenge
          value:
      code: 202
    # 2. Should return 400 if the context principal is
    # different from the principal in the account.
    - pre:
        - domain: account
          service: core
          root: some-account-root
          action: register
          payload:
            emailHmac: 
              type: hmac 
              secretKey: email-hmac-key
              message: some@email.com
            password: "#some-password" 
            principal:
              root: some-principal
              service: some-service
              network: some.network
      payload:
        email: some@email.com
        password: some-password
      context:
        principal:
          root: some-context-principal-root
      code: 400
    # 3. Should return successfully if challenging an existing account correctly, without a password.
    - pre:
        - domain: account
          service: core
          root: some-other-account-root
          action: register
          payload:
            emailHmac: 
              type: hmac 
              secretKey: email-hmac-key
              message: some@otheremail.com
            principal:
              root: some-principal
              service: some-service
              network: some.network
      context: {}
      payload:
        # password: "some-password"
        email: some@otheremail.com
      response:
        receipt:
          challenge:
            root:
            service:
            network:
      tokens:
        - network:
          type: challenge
          value:
      code: 202
    # 4. Should return successfully if challenging an existing account correctly, with a password.
    - pre:
        - domain: account
          service: core
          root: some-other-account-root
          action: register
          payload:
            emailHmac: 
              type: hmac 
              secretKey: email-hmac-key
              message: some@otheremail.com
            password: "#some-password"
            principal:
              root: some-principal
              service: some-service
              network: some.network
      context: {}
      payload:
        password: "some-password"
        email: some@otheremail.com
      response:
        receipt:
          challenge:
            root:
            service:
            network:
      tokens:
        - network:
          type: challenge
          value:
      code: 202
    # 5. Should return 400 if the password is not correct.
    - pre:
        - domain: account
          service: core
          root: yet-another-account-root
          action: register
          payload:
            emailHmac: 
              type: hmac 
              secretKey: email-hmac-key
              message: yet@anotheremail.com
            password: "#some-password"
            principal:
              root: yet-another-principal
              service: some-service
              network: some.network
      payload:
        email: yet@anotheremail.com
        password: some-bogus
      code: 400

#don't change
procedure: command
