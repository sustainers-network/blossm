name: delete
domain: scene
service: core

contexts:
  - principal

payload:
  scene:
    root: uuid
    service: string
    network: domain

dependencies:
  "@blossm/errors": "*"
  "@blossm/datetime": "*"

devDependencies:
  "mocha": "^11.6.0"
  "chai": "^5.2.0"
  "sinon": "^21.0.0"
  "sinon-chai": "^4.0.0"
  "chai-datetime": "^1.8.1"

testing:
  validate:
    ok:
      - scene:
          root: cb00ed30-b743-4fda-a8a1-c27544374f2e
          service: some-service
          network: local.network

  normalize:
    - payload:
        scene:
          root: cb00ed30-b743-4fda-a8a1-c27544374f2e
          service: some-service
          network: local.network
          some: bogus
      normalized:
        scene:
          root: cb00ed30-b743-4fda-a8a1-c27544374f2e
          service: some-service
          network: local.network

  dependencies:
    - domain: principal
      service: core
      procedure: event-store
    - domain: group
      service: core
      procedure: event-store

  steps:
    - pre:
        - domain: group 
          service: core
          root: some-group-root
          action: add-principals
          payload:
            principals:
              - root: some-principal-root
                service: core
                network: local.network
        - domain: scene
          service: core
          root: cb00ed30-b743-4fda-a8a1-c27544374f2e
          action: register
          payload:
            group:
              root: some-group-root
              service: core
              network: local.network
      context:
        principal:
          root: some-principal-root
          service: core
          network: local.network
      payload:
        scene:
          root: cb00ed30-b743-4fda-a8a1-c27544374f2e
          service: some-scene-service-root
          network: some.scene-network-root
      code: 202
    - pre:
        - domain: scene
          service: core
          root: db00ed30-b743-4fda-a8a1-c27544374f2e
          action: register
          payload:
            group:
              root: some-random-group-root
              service: core
              network: local.network
      context:
        principal:
          root: some-principal-root
          service: core
          network: local.network
      payload:
        scene:
          root: db00ed30-b743-4fda-a8a1-c27544374f2e
          service: some-scene-service-root
          network: some.scene-network-root
      code: 403
    - pre:
        - domain: scene
          service: core
          root: cb00ed30-b743-4fda-a8a1-c27544374f2e
          action: delete
          payload:
            deleted: 2019-12-31T00:00:00.000Z
      payload:
        scene:
          root: cb00ed30-b743-4fda-a8a1-c27544374f2e
          service: some-scene-service-root
          network: some.scene-network-root
      context:
        principal:
          root: some-principal-root
          service: core
          network: local.network
      code: 204

#don't change
procedure: command
