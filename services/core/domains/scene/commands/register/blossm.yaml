name: register
domain: scene
service: core

payload:
  role:
    type: string
    in:
      - SceneAdmin
      - SceneViewer
    optional: true
  # The subject is the entity that is being represented by this scene.
  subject:
    root: string
    domain: string
    service: string
    network:
      type: domain
      is: $network

dependencies:
  "@blossm/uuid": "*"

devDependencies:
  "mocha": "^11.6.0"
  "chai": "^5.2.0"
  "sinon": "^21.0.0"
  "sinon-chai": "^4.0.0"

testing:
  validate:
    # TODO do we need context here?
    context:
      network: some.network
    ok:
      - subject:
          root: some-root
          domain: some-domain
          service: some-service
          network: some.network
      - role: SceneViewer
        subject:
          root: some-root
          domain: some-domain
          service: some-service
          network: some.network
      - subject:
          root: some-root
          domain: some-domain
          service: some-service
          network: some.network
    bad:
      - role: 3
      - role: some-bogus-role
      - subject: 3
      - subject:
          root: 3
      - subject:
          domain: 3
      - subject:
          service: 3
      - subject:
          network: 3
      - subject:
          network: some-bad-network

  normalize:
    - payload:
        subject:
          root: some-root
          domain: some-domain
          service: some-service
          network: some.network
          some: other
      normalized:
        subject:
          root: some-root
          domain: some-domain
          service: some-service
          network: some.network
    - payload:
        role: some-role
        subject:
          root: some-root
          domain: some-domain
          service: some-service
          network: some.network
      normalized:
        role: some-role
        subject:
          root: some-root
          domain: some-domain
          service: some-service
          network: some.network

  dependencies:
    - name: upgrade
      domain: session
      procedure: command
      service: core
    - domain: principal
      procedure: event-store
      service: core
    - domain: group
      procedure: event-store
      service: core

  steps:
    - pre:
        - domain: session
          service: core
          root: some-session-root
          action: start
          payload:
            device:
              os: some-os
      payload:
        role: SceneAdmin
        subject:
          root: some-root
          domain: some-domain
          service: some-service
          network: some.network
      context:
        network: some.network
        session:
          root: some-session-root
          service: some-session-service
          network: some.session-network
      claims:
        iss: some-iss
        aud: some-aud
        exp: 9999-12-31T00:00:00.000
      response:
        receipt:
          principal:
            root:
            service:
            network:
          scene:
            root:
            service:
            network:
        context:
      tokens:
        - network:
          type: access
          value:
      code: 202
    # No role
    - payload:
        subject:
          root: some-root
          domain: some-domain
          service: some-service
          network: some.network
      context:
        network: some.network
        session:
          root: some-session-root
          service: some-session-service
          network: some.session-network
        principal:
          root: some-principal-root
          service: core
          network: some.other-network
      claims:
        iss: some-iss
        aud: some-aud
        exp: 9999-12-31T00:00:00.000
      response:
        receipt:
          scene:
            root:
            service:
            network:
      code: 202
    - pre:
        - domain: session
          service: core
          root: some-other-session-root
          action: start
          payload:
            device:
              os: some-os
      payload:
        subject:
          root: some-root
          domain: some-domain
          service: some-service
          network: some.network
      context:
        network: some.network
        session:
          root: some-other-session-root
          service: some-session-service
          network: some.session-network
        principal:
          root: some-principal-root
          service: core
          network: some.other-network
      claims:
        iss: some-iss
        aud: some-aud
        exp: 9999-12-31T00:00:00.000
      response:
        receipt:
          scene:
            root:
            service:
            network:
      code: 202

#don't change
procedure: command
