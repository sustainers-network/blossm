SceneAdmin:
  title: Scene Admin
  permissions:
    - core:scene:delete
    - core:scene:read
    # Grant and revoke this scene's roles (SceneAdmin, SceneViewer) only.
    # The scope is enforced by the principal add-roles and remove-roles commands.
    - core:principal:update

SceneViewer:
  title: Scene Viewer
  permissions:
    - core:scene:read
