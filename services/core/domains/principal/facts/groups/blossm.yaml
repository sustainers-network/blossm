name: groups
domain: principal
service: core

contexts:
  - principal

devDependencies:
  "mocha": "^11.6.0"
  "chai": "^5.2.0"
  "sinon": "^21.0.0"
  "sinon-chai": "^4.0.0"

testing:
  dependencies:
    - domain: principal
      procedure: event-store
      service: core
    - domain: group
      procedure: event-store
      service: core

  steps:
    - pre:
        - domain: group
          service: core
          root: some-group-root
          action: add-principals
          payload:
            principals:
              - root: some-principal-root
                service: some-principal-service
                network: some.network
      context:
        principal:
          root: some-principal-root
          service: some-principal-service
          network: some.network
      response:
        - root: some-group-root
          service: core
          network: local.network
      code: 202
    - pre:
        - domain: group
          service: core
          root: some-other-group-root
          action: add-principals
          payload:
            principals:
              - root: some-other-principal-root
                service: some-other-principal-service
                network: some.other-network
      context:
        principal:
          root: some-principal-root
          service: some-principal-service
          network: some.network
      response: []
    - context:
        principal:
          root: some-missing-root
          service: some-missing-service
          network: some.network
      response: []
      code: 202

#don't change
procedure: fact
