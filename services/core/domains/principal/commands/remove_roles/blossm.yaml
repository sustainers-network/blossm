name: remove-roles
domain: principal
service: core

contexts:
  - scene
  - principal

dependencies:
  "@blossm/errors": "*"

payload:
  roles:
    type:
      - id: string
        subject:
          root: string
          domain: string
          service: string
          network:
            type: domain
            is: $network
    optional: true
  subjects:
    type:
      - root: string
        domain: string
        service: string
        network:
          type: domain
          is: $network
    optional: true

testing:
  validate:
    # do we need context here?
    context:
      network: some.network
    ok:
      - roles:
          - id: some-id
            subject:
              root: some-root
              domain: some-domain
              service: some-service
              network: some.network
        subjects: []
      - subjects:
          - root: some-root
            domain: some-domain
            service: some-service
            network: some.network
        roles: []
    bad:
      - roles:
          a: 1
      - subjects:
          a: 1
      - roles:
          - id: 3
      - roles:
          - subject:
              root: 3
      - roles:
          - subject:
              domain: 3
      - roles:
          - subject:
              service: 3
      - roles:
          - id: some-id
            subject:
              root: some-root
              domain: some-domain
              service: some-service
              network: some.whack-network
      - roles:
          - id: some-id
            subject:
              root: some-root
              domain: some-domain
              service: some-service
              network: some-whack-network
      - subjects:
          - root: 3
      - subjects:
          - domain: 3
      - subjects:
          - service: 3
      - subjects:
          - root: some-root
            domain: some-domain
            service: some-service
            network: some.whack-network
      - subjects:
          - root: some-root
            domain: some-domain
            service: some-service
            network: some-whack-network

  normalize:
    - payload:
        roles:
          - id: some-id
            subject:
              root: some-root
              domain: some-domain
              service: some-service
              network: some-network
            some: bogus
      normalized:
        roles:
          - id: some-id
            subject:
              root: some-root
              domain: some-domain
              service: some-service
              network: some-network
        subjects: []
    - payload:
        subjects:
          - root: some-root
            domain: some-domain
            service: some-service
            network: some-network
            some: bogus
      normalized:
        subjects:
          - root: some-root
            domain: some-domain
            service: some-service
            network: some-network
        roles: []

  dependencies:

  steps:
    # 0. A scene admin changes a role of the scene their session is in.
    - pre:
        - domain: principal
          service: core
          root: some-root
          action: add-roles
          payload:
            roles:
              - id: SceneAdmin
                subject:
                  root: some-scene-root
                  domain: scene
                  service: core
                  network: some.network
      payload:
        roles:
          - id: SceneAdmin
            subject:
              root: some-scene-root
              domain: scene
              service: core
              network: some.network
      context:
        network: some.network
        scene:
          root: some-scene-root
          service: core
          network: some.network
        principal:
          root: some-admin-root
          service: core
          network: some.network
      root: some-root
      code: 202
    # 1. Nothing left to change.
    - payload:
        roles:
          - id: SceneAdmin
            subject:
              root: some-scene-root
              domain: scene
              service: core
              network: some.network
      context:
        network: some.network
        scene:
          root: some-scene-root
          service: core
          network: some.network
        principal:
          root: some-admin-root
          service: core
          network: some.network
      root: some-root
      code: 204
    # 2. A role of a scene the session isn't in.
    - payload:
        roles:
          - id: SceneAdmin
            subject:
              root: some-other-scene-root
              domain: scene
              service: core
              network: some.network
      context:
        network: some.network
        scene:
          root: some-scene-root
          service: core
          network: some.network
        principal:
          root: some-admin-root
          service: core
          network: some.network
      root: some-root
      code: 403
    # 3. A role that isn't a scene role.
    - payload:
        roles:
          - id: NodeNetwork
            subject:
              root: some-scene-root
              domain: scene
              service: core
              network: some.network
      context:
        network: some.network
        scene:
          root: some-scene-root
          service: core
          network: some.network
        principal:
          root: some-admin-root
          service: core
          network: some.network
      root: some-root
      code: 403
    # 4. An admin removing their own admin role.
    - payload:
        roles:
          - id: SceneAdmin
            subject:
              root: some-scene-root
              domain: scene
              service: core
              network: some.network
      context:
        network: some.network
        scene:
          root: some-scene-root
          service: core
          network: some.network
        principal:
          root: some-admin-root
          service: core
          network: some.network
      root: some-admin-root
      code: 403

#don't change
procedure: command
