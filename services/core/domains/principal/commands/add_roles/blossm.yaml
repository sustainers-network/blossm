name: add-roles
domain: principal
service: core

contexts:
  - scene
  - principal

dependencies:
  "@blossm/errors": "*"

payload:
  roles:
    - id: string
      subject:
        root: string
        domain: string
        service: string
        network:
          type: domain
          is: $network

testing:
  validate:
    # need context because the type of subject.network is $network, which is a special type that requires context.network to match.
    context:
      network: some.network
    ok:
      - roles:
          - id: some-id
            subject:
              root: some-root
              domain: some-domain
              service: some-service
              network: some.network
    bad:
      - roles:
          a: 1
      - roles:
          - id: 3
      - roles:
          - subject:
              root: 3
      - roles:
          - subject:
              domain: 3
      - roles:
          - subject:
              service: 3
      - roles:
          - id: some-id
            subject:
              root: some-root
              domain: some-domain
              service: some-service
              network: some.whack-network
      - roles:
          - id: some-id
            subject:
              root: some-root
              domain: some-domain
              service: some-service
              network: some-whack-network

  normalize:
    - payload:
        roles:
          - id: some-id
            subject:
              root: some-root
              domain: some-domain
              service: some-service
              network: some-network
      normalized:
        roles:
          - id: some-id
            subject:
              root: some-root
              domain: some-domain
              service: some-service
              network: some-network

  dependencies:

  steps:
    # 0. A scene admin changes a role of the scene their session is in.
    - pre:
        # The caller administers the scene.
        - domain: principal
          service: core
          root: some-admin-root
          action: add-roles
          payload:
            roles:
              - id: SceneAdmin
                subject:
                  root: some-scene-root
                  domain: scene
                  service: core
                  network: some.network
        - domain: principal
          service: core
          root: some-root
          action: add-roles
          payload:
            roles: []
      payload:
        roles:
          - id: SceneAdmin
            subject:
              root: some-scene-root
              domain: scene
              service: core
              network: some.network
      context:
        network: some.network
        scene:
          root: some-scene-root
          service: core
          network: some.network
        principal:
          root: some-admin-root
          service: core
          network: some.network
      root: some-root
      code: 202
    # 1. Nothing left to change.
    - payload:
        roles:
          - id: SceneAdmin
            subject:
              root: some-scene-root
              domain: scene
              service: core
              network: some.network
      context:
        network: some.network
        scene:
          root: some-scene-root
          service: core
          network: some.network
        principal:
          root: some-admin-root
          service: core
          network: some.network
      root: some-root
      code: 204
    # 2. A role of a scene the session isn't in.
    - payload:
        roles:
          - id: SceneAdmin
            subject:
              root: some-other-scene-root
              domain: scene
              service: core
              network: some.network
      context:
        network: some.network
        scene:
          root: some-scene-root
          service: core
          network: some.network
        principal:
          root: some-admin-root
          service: core
          network: some.network
      root: some-root
      code: 403
    # 3. A role that isn't a scene role.
    - payload:
        roles:
          - id: NodeNetwork
            subject:
              root: some-scene-root
              domain: scene
              service: core
              network: some.network
      context:
        network: some.network
        scene:
          root: some-scene-root
          service: core
          network: some.network
        principal:
          root: some-admin-root
          service: core
          network: some.network
      root: some-root
      code: 403

#don't change

procedure: command
