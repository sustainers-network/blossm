domain: principal
service: core

isPublic: true

actions:
  - add-roles
  - remove-roles
  - set-subject

schema:
  subject:
    domain: String
    root: String
    service: String
    network: String
  roles:
    - id: String
      subject:
        root: String
        domain: String
        service: String
        network: String

indexes:
  - subject.root
  - subject.domain
  - subject.service
  - subject.network

dependencies:
  "@blossm/array-difference": "*"

testing:
  examples:
    - action: add-roles
      payload:
        roles:
          - id: some-role
            subject:
              root: some-role-subject-root
              domain: some-role-subject-domain
              service: some-role-subject-service
              network: some.role-subject-network
          - id: some-other-role
            subject:
              root: some-other-role-subject-root
              domain: some-other-role-subject-domain
              service: some-other-role-subject-service
              network: some.other-role-subject-network
        subject:
          root: some-subject-root
          domain: some-subject-domain
          service: some-subject-service
          network: some.subject-network
    - action: remove-roles
      payload:
        roles:
          - id: some-role
            subject:
              root: some-role-subject-root
              domain: some-role-subject-domain
              service: some-role-subject-service
              network: some.role-subject-network
        subject:
          root: some-other-subject-root
          domain: some-other-subject-domain
          service: some-other-subject-service
          network: some.other-subject-network
    - action: set-subject
      payload:
        subject:
          root: yet-another-subject-root
          domain: yet-another-subject-domain
          service: yet-another-subject-service
          network: yet.another-subject-network

  handlers:
    - action: add-roles
      examples:
        - state:
            roles:
              - id: some-role
                subject:
                  root: some-role-subject-root
                  domain: some-role-subject-domain
                  service: some-role-subject-service
                  network: some.role-subject-network
          payload:
            roles:
              - id: some-role
                subject:
                  root: some-role-subject-root
                  domain: some-role-subject-domain
                  service: some-role-subject-service
                  network: some.role-subject-network
              - id: some-other-role
                subject:
                  root: some-other-role-subject-root
                  domain: some-other-role-subject-domain
                  service: some-other-role-subject-service
                  network: some.other-role-subject-network
          result:
            roles:
              - id: some-role
                subject:
                  root: some-role-subject-root
                  domain: some-role-subject-domain
                  service: some-role-subject-service
                  network: some.role-subject-network
              - id: some-other-role
                subject:
                  root: some-other-role-subject-root
                  domain: some-other-role-subject-domain
                  service: some-other-role-subject-service
                  network: some.other-role-subject-network
        - state:
            roles:
              - id: some-role
                subject:
                  root: some-role-subject-root
                  domain: some-role-subject-domain
                  service: some-role-subject-service
                  network: some.role-subject-network
          payload:
            roles:
              - id: some-other-role
                subject:
                  root: some-other-role-subject-root
                  domain: some-other-role-subject-domain
                  service: some-other-role-subject-service
                  network: some.other-role-subject-network
          result:
            roles:
              - id: some-role
                subject:
                  root: some-role-subject-root
                  domain: some-role-subject-domain
                  service: some-role-subject-service
                  network: some.role-subject-network
              - id: some-other-role
                subject:
                  root: some-other-role-subject-root
                  domain: some-other-role-subject-domain
                  service: some-other-role-subject-service
                  network: some.other-role-subject-network
        - state: {}
          payload:
            roles:
              - id: some-role
                subject:
                  root: some-role-subject-root
                  domain: some-role-subject-domain
                  service: some-role-subject-service
                  network: some.role-subject-network
          result:
            roles:
              - id: some-role
                subject:
                  root: some-role-subject-root
                  domain: some-role-subject-domain
                  service: some-role-subject-service
                  network: some.role-subject-network
    - action: remove-roles
      examples:
        - state:
            roles:
              - id: some-role
                subject:
                  root: some-role-subject-root
                  domain: some-role-subject-domain
                  service: some-role-subject-service
                  network: some.role-subject-network
              - id: some-other-role
                subject:
                  root: some-other-role-subject-root
                  domain: some-other-role-subject-domain
                  service: some-other-role-subject-service
                  network: some.other-role-subject-network
          payload:
            roles:
              - id: some-role
                subject:
                  root: some-role-subject-root
                  domain: some-role-subject-domain
                  service: some-role-subject-service
                  network: some.role-subject-network
          result:
            roles:
              - id: some-other-role
                subject:
                  root: some-other-role-subject-root
                  domain: some-other-role-subject-domain
                  service: some-other-role-subject-service
                  network: some.other-role-subject-network
        - state: {}
          payload:
            roles:
              - id: some-role
                subject:
                  root: some-role-subject-root
                  domain: some-role-subject-domain
                  service: some-role-subject-service
                  network: some.role-subject-network
          result:
            roles: []
    - action: set-subject
      examples:
        - state: {}
          payload:
            subject:
              root: some-subject-root
              domain: some-subject-domain
              service: some-subject-service
              network: some.subject-network
          result:
            subject:
              root: some-subject-root
              domain: some-subject-domain
              service: some-subject-service
              network: some.subject-network
        - state:
            subject:
              root: some-subject-root
              domain: some-subject-domain
              service: some-subject-service
              network: some.subject-network
          payload:
            subject:
              root: some-other-subject-root
              domain: some-other-subject-domain
              service: some-other-subject-service
              network: some.other-subject-network
          result:
            subject:
              root: some-other-subject-root
              domain: some-other-subject-domain
              service: some-other-subject-service
              network: some.other-subject-network

#don't change
procedure: event-store
