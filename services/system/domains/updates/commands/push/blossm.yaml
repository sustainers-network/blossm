name: push
domain: updates
service: system

payload:
  view:
    type: object
    optional: true
  # The parts of the channel. The command builds the channel from them and from
  # the caller's network, so a caller can't name a channel outright.
  name: string
  context:
    type: object
    optional: true
  principal:
    type: object
    optional: true
  key:
    type: string
    optional: true
  id: string
  trace:
    type:
      - string
    optional: true
  type:
    type: string
    in:
      - create
      - update
      - delete

dependencies:
  "grip": "*"
  "faas-grip": "*"
  "@blossm/gcp-secret": "*"
  "@blossm/channel-name": "*"
  "@blossm/errors": "*"

devDependencies:
  "mocha": "^7.1.1"
  "chai": "^5.2.0"
  "sinon": "^21.0.0"
  "sinon-chai": "^4.0.0"
  "chai-datetime": "^1.8.1"

env:
  production:
    FANOUT_REALM_ID: 874134c8
  sandbox:
    FANOUT_REALM_ID: 5b26a15b
  staging:
    FANOUT_REALM_ID: db0c81e3
  development:
    FANOUT_REALM_ID: 53b46805

testing:
  store: false
  dependencies:
    - procedure: http
      host: api.fanout.io
      mocks:
        - method: post
          path: "*"
          code: 200
          response: some-channel

  validate:
    ok:
      - view:
          headers:
            some: header
          body:
            some: property
        name: some-name
        context:
          root: some-context-root
          domain: some-context-domain
          service: some-context-service
          network: some.context-network
        principal:
          root: some-principal-root
          service: some-principal-service
          network: some.principal-network
        key: some-key
        id: some-id
        trace:
          - some-trace
        type: update
      - name: some-name
        id: some-id
        trace:
          - some-trace
        type: update
    bad:
      - view: 3
      - name: 3
      - name: some-name
        key: 3
      - type: bogus
      - id: 4
      - trace:
          - 3

  normalize:
    - payload:
        view:
          headers: some-headers
          body: some-body
        name: some-name
        context:
          root: some-context-root
          domain: some-context-domain
          service: some-context-service
          network: some.context-network
          some: bogus
        channel: some-channel
        type: some-type
        id: some-id
        trace: some-trace
      normalized:
        view:
          headers: some-headers
          body: some-body
        name: some-name
        context:
          root: some-context-root
          domain: some-context-domain
          service: some-context-service
          network: some.context-network
        type: some-type
        id: some-id
        trace: some-trace

  steps:
    - payload:
        view:
          headers:
            a: 1
          body:
            b: 2
        name: some-name
        type: update
        id: some-id
        trace:
          - some-trace
      context:
        network: some.node-network
        node:
          root: some-node-root
          service: some-node-service
          network: some-node-network
        connection:
          root: some-connection-root
          service: some-connection-service
          network: some-connection-network
        key:
          root: some-key-root
          service: some-key-service
          network: some-key-network
      code: 204
    # A caller the gateway knows no network for.
    - payload:
        name: some-name
        type: update
        id: some-id
      context:
        node:
          root: some-node-root
          service: some-node-service
          network: some-node-network
      code: 403
    # A part that would name a second channel.
    - payload:
        name: some-name
        key: "a,b"
        type: update
        id: some-id
      context:
        network: some.node-network
      code: 400

#don't change
procedure: command
