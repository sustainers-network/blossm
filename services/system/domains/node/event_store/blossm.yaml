domain: node
service: system

isPublic: true

actions:
  - register
  - verify

schema:
  network: String
  verified: Date
  scene:
    root: String
    service: String
    network: String

testing:
  examples:
    - action: register
      payload:
        network: some.network
        scene:
          root: some-scene
          service: some-scene-service
          network: some.scene-network
    - action: register
      payload:
        network: some.network
        scene:
          root: some-scene-root
          service: some-other-scene-service
          network: some.other-scene-network

  handlers:
    - action: register
      examples:
        - state:
            network: some.network
            scene:
              root: some-scene
              service: some-scene-service
              network: some.scene-network
          payload:
            network: some.other-network
            scene:
              root: some-other-scene
              service: some-other-scene-service
              network: some.other-scene-network
          result:
            network: some.other-network
            scene:
              root: some-other-scene
              service: some-other-scene-service
              network: some.other-scene-network
    - action: verify
      examples:
        - state:
            network: some.network
          payload:
            verified: 2020-01-01T00:00:00.000Z
          result:
            network: some.network
            verified: 2020-01-01T00:00:00.000Z

#don't change
procedure: event-store
