domain: email
service: comms

isPublic: false

actions:
  - send-auth-code

schema:
  from: String
  to: String
  subject: String
  message: String

testing:
  examples:
    - action: send-auth-code
      payload:
        from: some-from
        to: some-to
        subject: some-subject
        message: some-message
    - action: send-auth-code
      payload:
        from: some-from
        to: some-to
        subject: some-subject
        message: some-message

  handlers:
    - action: send-auth-code
      examples:
        - state:
            from: some-from
            to: some-to
            subject: some-subject
            message: some-message
          payload:
            from: some-other-from
            to: some-other-to
            subject: some-other-subject
            message: some-other-message
          result:
            from: some-other-from
            to: some-other-to
            subject: some-other-subject
            message: some-other-message

#don't change
procedure: event-store
