domain: email
service: comms

isPublic: false

actions:
  - send-auth-code

schema:
  from: String
  to: String

testing:
  examples:
    - action: send-auth-code
      payload:
        from: some-from
        to: some-to
    - action: send-auth-code
      payload:
        from: some-from
        to: some-to

  handlers:
    - action: send-auth-code
      examples:
        - state:
            from: some-from
            to: some-to
          payload:
            from: some-other-from
            to: some-other-to
          result:
            from: some-other-from
            to: some-other-to

#don't change
procedure: event-store
